name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/cd-demo

jobs:
  # ============================================
  # STAGE 1: Build and Test
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r day54/cd-pipeline/requirements54.txt

      - name: Generate version
        id: version
        run: echo "value=$(date +%Y.%m.%d).${GITHUB_RUN_NUMBER}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -f ${{ env.APP_DIR }}/Dockerfile54 \
            --build-arg APP_VERSION=${{ steps.version.outputs.value }} \
            -t ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .

      - name: Save image as artifact
        run: |
          docker save ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ============================================
  # STAGE 2: Deploy to Staging (Automatic)
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: https://staging.example.com
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load < image.tar.gz

      - name: Simulate staging deploy
        run: |
          echo "🚀 Deploying to staging..."
          echo "Environment: staging"
          echo "API key: *** (hidden)"
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "✅ Staging deployment complete"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests against staging..."
          echo "✅ All smoke tests passed"

  # ============================================
  # STAGE 3: Deploy to Production (Requires Approval)
  # ============================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    environment:
      name: production
      url: https://example.com
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load < image.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to registry
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ needs.build.outputs.version }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          echo "Version: ${{ needs.build.outputs.version }}"
          echo "Environment: production"
          echo "✅ Production deployment complete"

      - name: Verify deployment
        run: |
          echo "Verifying production health..."
          echo "✅ Production is healthy"
