name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r full-ci/requirements.txt
      - name: Lint
        run: flake8 full-ci/full-ci-app.py full-ci/full-ci-test_app.py --max-line-length=100

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r full-ci/requirements.txt
      - name: Test
        run: pytest -v

  summary:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Success
        run: echo "All checks passed! Ready to deploy."
