name: DevSecOps Pipeline

on:
  push:
    branches: [master,main]
  pull_request:

jobs:
  # ============================================
  # 1. SECRET SCANNING
  # ============================================
  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history to scan past commits

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If it finds a secret, the pipeline fails here.

  # ============================================
  # 2. STATIC CODE SCANNING (SAST)
  # ============================================
  sast-scan:
    name: Bandit SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r day59/mini-project -x ./tests,./venv
        # -r: recursive, -x: exclude test folders and virtual environments

  # ============================================
  # 3. CONTAINER IMAGE SCANNING
  # ============================================
  image-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-scan] # Only build if secret and SAST pass
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f day59/mini-project/Dockerfile59 \
            -t my-secure-app:latest \
            day59/mini-project

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-secure-app:latest'
          format: 'table'
          exit-code: '1'     # Fail the build if vulnerabilities are found
          ignore-unfixed: true # Ignore vulnerabilities with no fix available
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' # Only fail on high/critical
