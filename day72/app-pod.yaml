apiVersion: v1
kind: Pod
metadata:
  name: storage-pod
spec:
  containers:
    - name: alpine
      image: alpine
      command: ["/bin/sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: my-storage
          mountPath: /data   # The container will see the volume here
  volumes:
    - name: my-storage
      persistentVolumeClaim:
        claimName: my-data-pvc    # Attach the PVC we created
