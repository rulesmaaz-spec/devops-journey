apiVersion: v1
kind: Pod
metadata:
  name: config-test-pod
spec:
  containers:
    - name: my-app
      image: alpine
      command: ["/bin/sh", "-c", "sleep 3600"]
      env:
        # 1. Inject a specific key from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_ENV
        
        # 2. Inject ALL keys from Secret as environment variables
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: DB_PASSWORD

      # 3. Or, inject the ENTIRE ConfigMap as environment variables
      envFrom:
        - configMapRef:
            name: app-config
