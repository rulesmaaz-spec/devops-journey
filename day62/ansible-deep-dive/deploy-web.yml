---
- name: Deploy Dynamic Web Server
  hosts: webservers
  become: yes

  vars:
    project_name: "DevOps Journey"
   # environment: "development"

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Deploy index.html from template
      template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
      notify: Restart Nginx   # <--- Notifies the handler

    - name: Ensure Nginx is running and enabled
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Show which environment this server is
      debug:
        msg: "This server is in the {{ app_env }} environment"

  handlers:
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted
