apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-web
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-web
  template:
    metadata:
      labels:
        app: flask-web
    spec:
      containers:
        - name: flask-web
          image: taskmanager:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          # Good practice: Health checks
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: flask-web
  namespace: microservices
spec:
  type: NodePort # To expose to the outside
  selector:
    app: flask-web
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
